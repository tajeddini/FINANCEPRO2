name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Capacitor CLI 8.5+ requires Node >= 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (Temurin 21 — required by AGP 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      # The android/ platform folder is gitignored, so generate it in CI.
      # If it is ever committed to the repo, this step is safely skipped.
      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor (copies dist/ into the app)
        run: npx cap sync android

      # امضای دیباگ ثابت: هر اجرا با همان کلید commit‌شده امضا می‌کند تا
      # آپدیت APK روی نسخهٔ نصب‌شده بدون خطای «package conflicts» انجام شود.
      - name: Apply fixed debug signing
        run: |
          if [ ! -f "keys/debug.keystore.p12" ]; then
            echo "::error::keys/debug.keystore.p12 not found — run 'node scripts/gen-debug-keystore.mjs' once and commit it."
            exit 1
          fi
          MARKER="keys/debug-signing.gradle"
          if ! grep -q "$MARKER" android/app/build.gradle; then
            echo "apply from: '$GITHUB_WORKSPACE/keys/debug-signing.gradle'" >> android/app/build.gradle
            echo "✅ Fixed debug signing applied."
          else
            echo "ℹ️ Signing already applied — skipped."
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
