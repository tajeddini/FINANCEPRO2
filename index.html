<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2620" />
    <meta name="description" content="فایننس‌پرو — دفترکل دیجیتال شخصی برای کاربران فارسی‌زبان؛ تقویم شمسی، اعداد فارسی، ربات تلگرام" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>فایننس‌پرو — دفترکل دیجیتال شخصی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      /* اعمال تم ذخیره‌شده قبل از رندر — جلوگیری از فلش تم اشتباه */
      (function () {
        try {
          var t = localStorage.getItem("fp_theme") || "dark";
          if (t === "light") document.documentElement.classList.add("light");
          var a = localStorage.getItem("fp_accent");
          if (a) document.documentElement.setAttribute("data-accent", a);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
