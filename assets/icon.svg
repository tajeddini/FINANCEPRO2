<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a2f"/>
      <stop offset="1" stop-color="#0a2019"/>
    </linearGradient>
  </defs>

  <!-- پس‌زمینهٔ زمردی -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- نمودار صعودی به شکل M — نماد رشد مالی -->
  <path d="M 250 700 L 250 440 L 470 590 L 690 330 L 690 700"
        fill="none" stroke="#e8b04b" stroke-width="88"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- نقطهٔ اوج — سکهٔ نعناعی -->
  <circle cx="690" cy="330" r="58" fill="#3ecf94"/>
  <circle cx="690" cy="330" r="58" fill="none" stroke="#0a2019" stroke-width="14"/>
</svg>
